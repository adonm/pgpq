<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>postfgb · RustGIS</title>
<style>
:root{--bar:56px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:13px/1.4 ui-sans-serif,system-ui,sans-serif;background:#111;color:#e5e5e5}
#app{display:grid;grid-template-columns:300px 1fr;height:100%}
#side{background:#18181b;border-right:1px solid #27272a;display:flex;flex-direction:column;overflow:hidden}
#side header{padding:12px 14px;border-bottom:1px solid #27272a;display:flex;align-items:center;justify-content:space-between}
#side header h1{margin:0;font-size:14px;font-weight:600;letter-spacing:.2px}
#side header a{color:#71717a;text-decoration:none;font-size:11px;margin-left:8px}
#side header a:hover{color:#e5e5e5}
#toolbar{padding:10px 14px;border-bottom:1px solid #27272a;display:grid;gap:6px;font-size:11px;color:#71717a}
#toolbar label{display:flex;align-items:center;gap:6px}
input[type=number]{width:100%;background:#09090b;color:#e5e5e5;border:1px solid #27272a;border-radius:4px;padding:5px 7px;font:11px ui-monospace,monospace}
button{background:#1e293b;color:#e5e5e5;border:1px solid #334155;border-radius:4px;padding:6px 8px;font:12px inherit;cursor:pointer}
button:hover{background:#334155}
button.ghost{background:transparent;border-color:#27272a;color:#94a3b8}
button.ghost:hover{color:#e5e5e5;border-color:#334155}
#list{overflow-y:auto;flex:1;padding:6px}
.item{padding:8px 10px;border-radius:4px;cursor:pointer}
.item:hover{background:#27272a}
.item.active{background:#1e293b}
.name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11px;color:#71717a}
.hint{padding:10px 14px;font-size:11px;color:#71717a;border-top:1px solid #27272a}
.hint p{margin:0 0 6px}
#main{position:relative;display:flex;flex-direction:column}
#bar{position:absolute;inset:0 auto auto 0;width:100%;display:flex;gap:8px;align-items:center;padding:6px 10px;background:rgba(17,17,17,.85);backdrop-filter:blur(4px);border-bottom:1px solid #27272a;font:11px ui-monospace,monospace;color:#94a3b8;z-index:2}
#bar .url{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl}
iframe{border:0;width:100%;height:100%;background:#0b0b0d}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#52525b;flex-direction:column;gap:8px}
#bottom-bar{display:none}
#backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:19}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:860px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:72vh;transform:translateY(105%);transition:transform .22s ease;z-index:20;border-right:0;border-top:1px solid #27272a;border-radius:14px 14px 0 0;padding-bottom:calc(var(--bar) + env(safe-area-inset-bottom))}
  #side.open{transform:translateY(0)}
  #side header{border-radius:14px 14px 0 0}
  #main{padding-bottom:calc(var(--bar) + env(safe-area-inset-bottom))}
  #bar{display:none}
  #bottom-bar{display:flex;position:fixed;left:0;right:0;bottom:0;height:calc(var(--bar) + env(safe-area-inset-bottom));padding:0 4px env(safe-area-inset-bottom);background:#18181b;border-top:1px solid #27272a;z-index:21}
  #bottom-bar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:transparent;border:0;border-radius:0;color:#94a3b8;font-size:11px;padding:0}
  #bottom-bar button:hover{background:#27272a;color:#e5e5e5}
  #bottom-bar button[aria-expanded=true],#bottom-bar button.active{color:#38bdf8}
  #bottom-bar svg{width:20px;height:20px;display:block}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side" aria-label="Collections">
    <header>
      <h1>postfgb</h1>
      <nav><a href="/collections">OGC</a><a href="/stac">STAC</a><a href="/api">OpenAPI</a></nav>
    </header>
    <div id="toolbar">
      <button id="stac" class="ghost">Open STAC search in RustGIS</button>
      <label>Max features <input id="limit" type="number" min="0" step="100000" placeholder="all"></label>
      <button id="opentab" class="ghost" disabled>Open in a new tab</button>
    </div>
    <div id="list"></div>
    <div class="hint">
      <p>Collections open in the <b>RustGIS</b> web app as FlatGeobuf downloads (data stays on your server; CORS is open).</p>
      <p>Huge collections default to the first 200,000 features — lower “Max features” or clear it to fetch everything.</p>
    </div>
  </aside>
  <div id="main">
    <div id="bar"><span>rustgis</span><span class="url" id="url"></span><button id="copy" class="ghost">copy</button></div>
    <div id="empty">Pick a collection…</div>
    <iframe id="app-frame" title="RustGIS" allow="fullscreen"></iframe>
  </div>
</div>
<div id="backdrop"></div>
<nav id="bottom-bar" aria-label="Viewer tabs">
  <button id="tab-layers" aria-expanded="false" aria-controls="side">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5zm0 8.7l6.5-3.6L21 9.5l-9 5-9-5 2.5-1.4L12 11.7zm0 4l6.5-3.6L21 13.5l-9 5-9-5 2.5-1.4L12 15.7z"/></svg>
    Layers
  </button>
  <button id="tab-stac">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 017 7c0 5.25-7 13-7 13S5 14.25 5 9a7 7 0 017-7zm0 9.5A2.5 2.5 0 1012 6.5a2.5 2.5 0 000 5z"/></svg>
    STAC
  </button>
  <button id="tab-open" disabled>
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14 3h7v7h-2V6.4l-8.3 8.3-1.4-1.4L17.6 5H14V3zM5 5h5v2H7v10h10v-3h2v5H5V5z"/></svg>
    Open
  </button>
</nav>
<script>
const RUSTGIS = 'https://web.rustgis.app/';
const frame = document.getElementById('app-frame');
const urlLabel = document.getElementById('url');
const limitInput = document.getElementById('limit');
const openTab = document.getElementById('opentab');
const openTabMobile = document.getElementById('tab-open');
const side = document.getElementById('side');
const backdrop = document.getElementById('backdrop');
const layersTab = document.getElementById('tab-layers');
const stacTab = document.getElementById('tab-stac');
const mobile = () => window.matchMedia('(max-width: 860px)').matches;
let collections = [];
let current = null;

function dataURL(col, limit) {
  const url = new URL(`${location.origin}/collections/${encodeURIComponent(col.id)}/items`);
  url.searchParams.set('f', 'flatgeobuf');
  if (limit > 0) url.searchParams.set('limit', limit);
  return url.toString();
}

function rustgisURL(col) {
  const params = new URLSearchParams();
  params.set('embed', '');
  params.set('blank', '');
  if (col) {
    params.set('data', dataURL(col, effectiveLimit(col)));
    const bbox = col.extent?.spatial?.bbox?.[0];
    if (bbox && bbox.length === 4) params.set('extent', bbox.join(','));
  }
  return RUSTGIS + '?' + params.toString();
}

function stacURL() {
  return RUSTGIS + '?embed&stac=' + encodeURIComponent(location.origin + '/stac');
}

function effectiveLimit(col) {
  const typed = parseInt(limitInput.value, 10);
  if (limitInput.value.trim() !== '' && !isNaN(typed)) return Math.max(0, typed);
  return col && col.featureCount > 2000000 ? 200000 : 0;
}

function setSheet(open) {
  side.classList.toggle('open', open);
  backdrop.style.display = open ? 'block' : 'none';
  layersTab.setAttribute('aria-expanded', String(open));
}

function show(src) {
  frame.src = src;
  urlLabel.textContent = src;
  document.getElementById('empty').style.display = 'none';
}

function load(col) {
  current = col;
  show(rustgisURL(col));
  openTab.disabled = false;
  openTabMobile.disabled = false;
  setSheet(false);
  renderList();
}

function openStac() {
  current = null;
  show(stacURL());
  setSheet(false);
  renderList();
}

function renderList() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  for (const col of collections) {
    const row = document.createElement('div');
    row.className = 'item' + (current && current.id === col.id ? ' active' : '');
    const count = col.featureCount >= 0 ? col.featureCount.toLocaleString() + ' features' : 'count unknown';
    row.innerHTML = `
      <div class="name"></div>
      <div class="sub">${escapeHTML(col.id)} · ${escapeHTML(count)}${col.kind === 'view' ? ' · view' : ''}</div>`;
    row.querySelector('.name').textContent = col.title || col.id;
    row.onclick = () => load(col);
    list.appendChild(row);
  }
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function featureCount(id) {
  try {
    const res = await fetch(`/collections/${encodeURIComponent(id)}/items?limit=1&numberMatched=true`);
    const body = await res.json();
    return typeof body.numberMatched === 'number' ? body.numberMatched : -1;
  } catch {
    return -1;
  }
}

limitInput.addEventListener('change', () => { if (current) load(current); });
openTab.addEventListener('click', () => { if (current) window.open(rustgisURL(current), '_blank', 'noopener'); });
openTabMobile.addEventListener('click', () => { if (current) window.open(rustgisURL(current), '_blank', 'noopener'); });
document.getElementById('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(frame.src); document.getElementById('copy').textContent = 'copied'; }
  catch { document.getElementById('copy').textContent = 'copy failed'; }
  setTimeout(() => { document.getElementById('copy').textContent = 'copy'; }, 1200);
});
document.getElementById('stac').addEventListener('click', openStac);
stacTab.addEventListener('click', openStac);
layersTab.addEventListener('click', () => setSheet(!side.classList.contains('open')));
backdrop.addEventListener('click', () => setSheet(false));
window.addEventListener('keydown', (e) => { if (e.key === 'Escape') setSheet(false); });

(async () => {
  const res = await fetch('/collections');
  const body = await res.json();
  collections = (body.collections || []).map(c => ({...c, featureCount: -1}));
  renderList();
  await Promise.all(collections.map(async col => { col.featureCount = await featureCount(col.id); }));
  collections.sort((a, b) => (b.featureCount - a.featureCount));
  renderList();
  const first = collections.find(col => col.featureCount >= 0 && col.featureCount <= 2000000) || collections[0];
  if (first) load(first);
  if (mobile()) setSheet(false);
})();
</script>
</body>
</html>
