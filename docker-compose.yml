services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postfgb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postfgb"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
